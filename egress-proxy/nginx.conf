user www-data;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    # Docker's embedded DNS server, used to resolve CONNECT targets.
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    log_format egress '$time_iso8601 $connect_host $connect_allowed $status';
    access_log /var/log/nginx/access.log egress;

    # Whole-domain allow list, plain CONNECT tunnel passthrough (no TLS
    # inspection). Kept in a gitignored file so it can differ per deployment
    # without touching version control. See allowed-domains.conf.example;
    # allowed-domains-map.conf is generated from it at build time by
    # generate-allowed-domains-map.sh.
    map $connect_host $connect_allowed {
        default 0;
        include /etc/nginx/allowed-domains-map.conf;
    }

    server {
        listen 8080;

        proxy_connect;
        proxy_connect_allow 443;
        proxy_connect_connect_timeout 10s;
        proxy_connect_data_timeout 60s;

        if ($connect_allowed = 0) {
            return 403 "egress-proxy: domain '$connect_host' is not in the allow list and was blocked.\n";
        }

        location / {
            return 403 "egress-proxy: only HTTPS CONNECT to allow-listed domains is supported.\n";
        }
    }
}
